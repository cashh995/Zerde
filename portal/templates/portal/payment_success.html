{% extends "portal/base.html" %}

{% block title %}Төлем сәтті өтті — Zerde{% endblock %}

{% block extra_css %}
<style>
  .success-card {
    background: rgba(255, 255, 255, 0.95);
    border: 1px solid rgba(25, 135, 84, 0.12);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(108, 99, 255, 0.12);
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .success-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 28px 60px rgba(108, 99, 255, 0.18);
  }
  .success-icon {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(25, 135, 84, 0.12), rgba(25, 135, 84, 0.06));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    margin: 0 auto 1.5rem;
    animation: successPulse 2s ease-in-out infinite;
  }
  @keyframes successPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.15); }
    50% { box-shadow: 0 0 0 20px rgba(25, 135, 84, 0); }
  }
  .success-title {
    font-weight: 800;
    font-size: 1.75rem;
    color: #198754;
    margin-bottom: 0.5rem;
  }
  .course-badge {
    background: linear-gradient(135deg, rgba(108, 99, 255, 0.08), rgba(255, 101, 132, 0.06));
    border: 1px solid rgba(108, 99, 255, 0.10);
    border-radius: 16px;
    padding: 1rem 1.5rem;
    display: inline-block;
    font-weight: 600;
    color: #6C63FF;
    font-size: 1.1rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6 col-xl-5">
    <div class="success-card p-4 p-md-5">
      <div class="success-icon">✅</div>
      <div class="success-title">Төлем сәтті өтті!</div>
      <p class="text-muted mb-4">
        Сіз курсқа сәтті жазылдыңыз. Оқуды қазір бастауға болады!
      </p>

      <div class="course-badge mb-4">{{ course.title }}</div>

      <div class="d-grid gap-3 mt-4">
        <a href="{% url 'portal:student_course_detail' course.id %}" class="btn btn-gradient py-3 fw-bold">
          Курсқа өту
        </a>
        <a href="{% url 'portal:student_dashboard' %}" class="btn btn-soft py-3 fw-semibold">
          Менің кабинетіме өту
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
